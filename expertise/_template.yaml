description: |
  [REQUIRED] Brief, clear description of what this expertise covers.
  This helps the expert agent decide if this file is relevant to their research.
  Keep it concise (1-3 sentences).

category: "technical"  # technical, domain, architecture, business-logic, integration

concepts:
  - "Key concept 1"
  - "Key concept 2"
  - "Key concept 3"

details: |
  Detailed explanation of the concepts, patterns, and knowledge.

  This is where the mental model lives:
  - Architectural patterns used
  - Business logic explanations
  - Domain concepts and relationships
  - Design decisions and rationale

  Keep this at a conceptual level - avoid specific file paths,
  line numbers, or implementation details that change frequently.

  Focus on:
  - What patterns are used and why
  - How different concepts relate to each other
  - Key design decisions and their rationale
  - Important constraints or requirements
  - Domain-specific terminology and meanings

related_files:
  - "src/module-name/**/*.ts"
  - "config/*.yaml"
  # File patterns or paths that relate to this expertise
  # Use glob patterns for flexibility

