description: |
  Claude Code agents system architecture and design. Agents are specialized
  autonomous subagents with isolated context windows, custom system prompts,
  and configurable tool access. Used for delegation of focused, single-purpose tasks.

category: "architecture"

concepts:
  - "Agents vs Skills (isolated context vs shared)"
  - "Single-purpose focus"
  - "Agent frontmatter configuration"
  - "Tool restrictions and permission modes"
  - "Context isolation"
  - "Delegation triggers"

details: |
  Agents System Architecture

  Agents are custom AI subprocesses that Claude delegates to using the Task tool.
  Unlike skills (which share main conversation context), agents have isolated
  context windows and can be configured with custom system prompts, restricted
  tool access, and specific permission modes.

  Key Differences from Skills:
  - Structure: Single .md file (not a directory)
  - Context: Isolated context window (no bleed from main conversation)
  - Triggering: Claude delegates via Task tool (not user-invoked)
  - Configuration: Custom tools, models, permissions (skills have none)
  - Nesting: CANNOT spawn other agents (skills can invoke skills)
  - Best for: Isolated operations, parallel work, constraints

  Agent Structure:
  Every agent is a .md file with YAML frontmatter and markdown system prompt.

  Required Frontmatter Fields:
  - name: hyphen-case identifier (1-64 chars)
  - description: When should Claude delegate to this agent? (THE most important field)

  Optional Frontmatter Fields:
  - tools: Array of allowed tool names (Read, Write, Edit, Grep, Bash, etc.)
  - disallowedTools: Array of blocked tools
  - model: sonnet, opus, haiku, or inherit
  - permissionMode: default, acceptEdits, dontAsk, bypassPermissions, plan
  - skills: Array of available skill names
  - hooks: Advanced pre/post-tool processing

  System Prompt:
  - Markdown body defines agent's behavior
  - Should be concise (200-2000 words typically)
  - Specific about role, scope, constraints
  - Instructive with clear steps or decision trees

  Core Principles:
  1. Single-purpose focus (one clear responsibility)
  2. Clear delegation triggers (description field)
  3. Context isolation (pass all needed context explicitly)

  Common Agent Types:
  - Read-only analysts: tools: [Read, Grep, Glob, Bash], permissionMode: plan
  - Focused editors: tools: [Read, Write, Edit, Bash], permissionMode: acceptEdits
  - Restricted researchers: limited tools, specific constraints

  Agent Creation Workflow:
  1. Understand agent's purpose
  2. Plan configuration (tools, model, permissions)
  3. Initialize with init_agent.py (templates: basic, read-only, editor, restricted)
  4. Edit system prompt
  5. Validate with validate_agent.py
  6. Place in .claude/agents/ and test

  The agent-creator skill provides guidance for creating effective agents.

related_files:
  - ".claude/agents/*.md"
  - ".claude/skills/agent-creator/SKILL.md"
  - ".claude/skills/agent-creator/scripts/*.py"
  - ".claude/skills/agent-creator/references/*.md"
